spring.application.name=audio-transcriber

# ===== PASTE YOUR GROQ API KEY BELOW (starts with gsk_) =====
# No quotes, no spaces, nothing else on this line.
spring.ai.openai.api-key=YOUR API KEY OF GROK

# Leave these as they are (Groq is OpenAI-compatible)
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.audio.transcription.options.model=whisper-large-v3-turbo
spring.ai.openai.audio.transcription.options.response-format=json

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
